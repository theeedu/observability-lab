name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela execuções antigas da mesma branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------- API (Python) ----------------------------- #
  api:
    name: API · lint & tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes (pytest)
        run: pytest -q

  # ------------------------------ Worker (Go) ------------------------------ #
  worker:
    name: Worker · vet, build & test (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/worker/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  # ------------------------------- Terraform ------------------------------- #
  terraform:
    name: Infra · fmt & validate (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  # ------------------------------ Shell lint ------------------------------- #
  shellcheck:
    name: Scripts · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

  # ------------------------- Build das imagens Docker ---------------------- #
  docker-build:
    name: Docker · build das imagens
    runs-on: ubuntu-latest
    needs: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          tags: observability-lab/api:ci
      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/worker
          push: false
          tags: observability-lab/worker:ci

  # --------------------- Validação da stack (compose) ---------------------- #
  compose-validate:
    name: Compose · config válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config -q
