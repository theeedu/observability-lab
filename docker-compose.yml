# =========================================================================== #
# Observability & DevOps Lab — stack completa, self-hosted, sem dependências
# externas. Sobe API + Worker + Prometheus + Grafana + Loki + Promtail +
# Alertmanager com um único `docker compose up`.
# =========================================================================== #
name: observability-lab

services:
  # ----------------------------- Aplicação -------------------------------- #
  api:
    build: ./services/api
    container_name: obs-api
    ports:
      - "8000:8000"
    networks:
      - obs
    restart: unless-stopped
    labels:
      logging: "promtail"

  worker:
    build: ./services/worker
    container_name: obs-worker
    environment:
      API_BASE_URL: "http://api:8000"
      METRICS_ADDR: ":9100"
      INTERVAL_SECONDS: "3"
    depends_on:
      - api
    networks:
      - obs
    restart: unless-stopped
    labels:
      logging: "promtail"

  # --------------------------- Observabilidade ---------------------------- #
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    volumes:
      - ./stack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./stack/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - obs
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: obs-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./stack/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - obs
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: obs-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./stack/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - obs
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: obs-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./stack/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - obs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./stack/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./stack/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - obs
    restart: unless-stopped

networks:
  obs:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
