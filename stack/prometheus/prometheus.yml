# Configuração do Prometheus — coleta de métricas dos serviços do lab
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: observability-lab

# Alertas são enviados ao Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Regras de alerta (SLO/RED)
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker
