# Loki — configuração single-binary com armazenamento em filesystem (sem S3/nuvem)
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 24h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Loki 3.x tenta detectar service_name automaticamente; desligamos para
  # evitar streams inconsistentes e manter os labels vindos do Promtail.
  discover_service_name: []
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
