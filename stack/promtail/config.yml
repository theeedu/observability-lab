# Promtail — coleta logs dos containers Docker e envia ao Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Coleta apenas containers marcados com a label logging=promtail
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # Label estático garantido — todo stream tem, no mínimo, este label
      - target_label: job
        replacement: docker
      # Nome do container (remove a "/" inicial)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
      # Projeto do Compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
