# Promtail — coleta logs dos containers Docker e envia ao Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Descobre containers Docker automaticamente e coleta seus logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nome do container como label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Projeto compose como label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      # Só coleta containers marcados com label logging=promtail
      - source_labels: ["__meta_docker_container_label_logging"]
        regex: "promtail"
        action: keep
    pipeline_stages:
      # Tenta parsear logs em JSON (a API emite JSON estruturado)
      - json:
          expressions:
            level: level
            endpoint: endpoint
            status: status
      - labels:
          level:
